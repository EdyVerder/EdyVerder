name: mapa estelar

on:
  schedule:
    - cron: "0 6 * * *"   # 03:00 em Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/mapa_estelar.py", ".github/workflows/mapa-estelar.yml"]

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gera o mapa a partir das contribuições do último ano
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p saida
          python3 scripts/mapa_estelar.py "${{ github.repository_owner }}" saida/mapa-estelar.svg

      - name: Publica na branch output (só o SVG, sem histórico)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd saida
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mapa-estelar.svg
          git commit -q -m "mapa estelar $(date -u +%F)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" output

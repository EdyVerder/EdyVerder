name: monitor de cargas

on:
  schedule:
    - cron: "0 6 * * *"   # 03:00 em Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/painel_cargas.py", "scripts/gerar_banner_fabrica.py", ".github/workflows/monitor-cargas.yml"]

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instala o fontTools (o texto do painel vira contorno)
        run: python -m pip install --quiet fonttools

      - name: Gera o painel com as contribuições do último ano
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p saida
          python scripts/painel_cargas.py "${{ github.repository_owner }}" saida/painel-cargas.svg

      - name: Publica na branch output (só o SVG, sem histórico)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd saida
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add painel-cargas.svg
          git commit -q -m "monitor de cargas $(date -u +%F)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" output
